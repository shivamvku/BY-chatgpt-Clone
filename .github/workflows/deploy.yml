name: Application release
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-dev-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: infra-deploy
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_state_resource_group: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_VAR_state_storage_account: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.lock && pip install --no-deps -e './backend[dev]' && ruff check backend
      - run: pytest
        working-directory: backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.13.5'
      - run: bash infra/pipelines/init-state.sh foundation
      - name: Build image on runner and push to Azure Container Registry
        run: bash infra/pipelines/build-image.sh
      - run: bash infra/pipelines/init-state.sh migrations
      - run: terraform -chdir=infra/terraform/environments/dev/migrations plan -input=false -out=release.tfplan
      - run: terraform -chdir=infra/terraform/environments/dev/migrations apply -input=false release.tfplan
      - run: bash infra/pipelines/migrate.sh
      - run: bash infra/pipelines/init-state.sh application
      - run: terraform -chdir=infra/terraform/environments/dev/application plan -input=false -out=release.tfplan
      - run: terraform -chdir=infra/terraform/environments/dev/application apply -input=false release.tfplan
      - run: bash infra/pipelines/smoke.sh
