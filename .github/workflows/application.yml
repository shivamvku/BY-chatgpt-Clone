name: Application

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to perform
        type: choice
        options:
          - test-only
          - deploy
          - promote-admin
          - migration-status
        default: deploy
      admin_email:
        description: Admin email (for promote-admin only)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'production-deployment' || format('application-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
  TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_state_resource_group: ${{ vars.TF_STATE_RESOURCE_GROUP }}
  TF_VAR_state_storage_account: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
  TF_VAR_release_commit: ${{ github.sha }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
jobs:
  # Test jobs (always run)
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: younderchat_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U chat -d younderchat_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://chat:test-only-password@localhost:5432/younderchat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.lock && pip install --no-deps -e './backend[dev]'
      - name: Lint with Ruff
        run: ruff check backend
      - name: Run tests
        run: pytest
        working-directory: backend
    timeout-minutes: 10

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and test
        run: npm ci && npm run lint && npm run format:check && npm run test && npm run build
        working-directory: frontend
    timeout-minutes: 10

  # Temporary safety valve: run E2E tests and report failures, but do not block
  # PR validation or deployment while flaky browser interactions are investigated.
  # Backend and frontend checks remain required; restore blocking E2E after stabilizing.
  browser-tests:
    name: Browser Tests
    continue-on-error: true
    runs-on: ubuntu-24.04
    needs: [backend-tests, frontend-tests]
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: younderchat_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U chat -d younderchat_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://chat:test-only-password@localhost:5432/younderchat_test
      RUNTIME_DATABASE_URL: postgresql+psycopg://chat_runtime:test-runtime-only-password@localhost:5432/younderchat_test
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.lock && pip install --no-deps -e './backend[dev]'
      - name: Run migrations
        run: python -m app.db.migrate
        working-directory: backend
      - name: Install frontend dependencies and Playwright
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run browser tests
        run: bash infra/pipelines/browser.sh
    timeout-minutes: 15

  # Deployment jobs (only on main branch push or manual deploy)
  deploy:
    name: Deploy to Production
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy') }}
    needs: [backend-tests, frontend-tests, browser-tests]
    runs-on: ubuntu-24.04
    environment: infra-deploy
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./infra/actions/azure
      - name: Initialize Terraform state
        run: bash infra/pipelines/init-state.sh foundation
      - name: Build and push Docker image
        id: build
        run: bash infra/pipelines/build-image.sh
      - name: Deploy migrations
        env:
          TF_VAR_image: ${{ steps.build.outputs.image }}
        run: bash infra/pipelines/release-stack.sh migrations
      - name: Deploy application
        env:
          TF_VAR_image: ${{ steps.build.outputs.image }}
        run: bash infra/pipelines/release-stack.sh application
      - name: Run smoke tests
        run: bash infra/pipelines/smoke.sh

  # Database operations (manual only)
  database-ops:
    name: Database Operations
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'promote-admin' || inputs.operation == 'migration-status') }}
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-24.04
    environment: infra-deploy
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      OPERATION: ${{ inputs.operation }}
      OPERATOR_EMAIL: ${{ inputs.admin_email }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./infra/actions/azure
      - name: Run database operation
        run: bash infra/pipelines/operations.sh
