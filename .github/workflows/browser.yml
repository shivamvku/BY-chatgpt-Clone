name: Browser integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: younderchat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chat -d younderchat_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://chat:test-only-password@localhost:5432/younderchat_test
      RUNTIME_DATABASE_URL: postgresql+psycopg://chat_runtime:test-runtime-only-password@localhost:5432/younderchat_test
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements-dev.lock && pip install --no-deps -e './backend[dev]'
      - run: python -m app.db.migrate
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start application and run browser tests
        run: |
          (cd backend && DATABASE_URL="$RUNTIME_DATABASE_URL" python -m tests.browser_server) > /tmp/api.log 2>&1 &
          (cd frontend && npm run dev -- --host 127.0.0.1) > /tmp/ui.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173/api/health/ready; then break; fi
            sleep 2
          done
          cd frontend && npm run test:e2e
