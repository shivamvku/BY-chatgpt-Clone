name: Infrastructure

on:
  pull_request:
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      stack:
        description: Infrastructure stack
        type: choice
        options:
          - foundation
          - domains
        default: foundation
      action:
        description: Action to perform
        type: choice
        options:
          - plan
          - apply
          - start-db-access
          - stop-db-access
        default: plan

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ inputs.stack || 'validation' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ inputs.action == 'apply' && vars.AZURE_DEPLOY_CLIENT_ID || vars.AZURE_PLAN_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
  TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_state_resource_group: ${{ vars.TF_STATE_RESOURCE_GROUP }}
  TF_VAR_state_storage_account: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
  TF_VAR_name: ${{ vars.AZURE_APP_NAME }}
  TF_VAR_deploy_principal_id: ${{ vars.AZURE_DEPLOY_PRINCIPAL_ID }}
  TF_VAR_plan_principal_id: ${{ vars.AZURE_PLAN_PRINCIPAL_ID }}

jobs:
  validate:
    name: Terraform Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - name: Validate Terraform
        run: bash infra/pipelines/validate.sh
    timeout-minutes: 10

  infrastructure:
    name: ${{ inputs.action == 'apply' && 'Apply' || inputs.action == 'plan' && 'Plan' || inputs.action }} ${{ inputs.stack }}
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-24.04
    environment: ${{ inputs.action == 'apply' && 'infra-deploy' || 'infra-plan' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      STACK: ${{ inputs.stack }}
      ACTION: ${{ inputs.action }}
      TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
      TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
      TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
      TF_VAR_db_access_cidr: ${{ vars.DB_ACCESS_CIDR }}
      TF_VAR_db_access_public_key: ${{ vars.DB_ACCESS_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./infra/actions/azure
      - name: Run infrastructure operation
        run: bash infra/pipelines/infrastructure.sh
      - name: Verify infrastructure
        if: ${{ inputs.action == 'apply' }}
        env:
          AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME }}
        run: bash infra/pipelines/verify-infrastructure.sh