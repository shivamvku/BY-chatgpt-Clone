name: Infrastructure
"on":
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stack:
        description: Infrastructure state to operate on
        type: choice
        options:
          - foundation
          - domains
        default: foundation
      action:
        description: Plan or apply the selected state
        type: choice
        options:
          - plan
          - apply
          - start-db-access
          - stop-db-access
        default: plan
permissions:
  contents: read
concurrency:
  group:
    ${{ github.event_name == 'workflow_dispatch' && 'azure-dev-deployment' || format('infrastructure-{0}', github.ref)
    }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ inputs.action != 'plan' && github.event_name == 'workflow_dispatch' && vars.AZURE_DEPLOY_CLIENT_ID || vars.AZURE_PLAN_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
  TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_state_resource_group: ${{ vars.TF_STATE_RESOURCE_GROUP }}
  TF_VAR_state_storage_account: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
  TF_VAR_name: ${{ vars.AZURE_APP_NAME }}
  BUDGET_ALERT_EMAIL: ${{ vars.AZURE_BUDGET_ALERT_EMAIL }}
  TF_VAR_deploy_principal_id: ${{ vars.AZURE_DEPLOY_PRINCIPAL_ID }}
  TF_VAR_plan_principal_id: ${{ vars.AZURE_PLAN_PRINCIPAL_ID }}
  TF_VAR_operator_principal_id: ${{ vars.AZURE_OPERATOR_PRINCIPAL_ID }}
jobs:
  validate:
    name: 1 · Terraform validation and policy tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.13.5
      - run: bash infra/pipelines/validate.sh
    timeout-minutes: 15
  provision:
    name: 2 · Terraform plan and apply
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.action != 'plan' && 'infra-deploy' || 'infra-plan' }}
    permissions:
      contents: read
      id-token: write
    env:
      STACK: ${{ inputs.stack }}
      ACTION: ${{ inputs.action }}
      TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
      TF_VAR_db_access_cidr: ${{ vars.DB_ACCESS_CIDR }}
      TF_VAR_db_access_public_key: ${{ vars.DB_ACCESS_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./infra/actions/azure
      - run: bash infra/pipelines/infrastructure.sh
  verify:
    name: 3 · Verify infrastructure
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action != 'plan' }}
    needs: provision
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: infra-deploy
    permissions:
      contents: read
      id-token: write
    env:
      STACK: ${{ inputs.stack }}
      AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./infra/actions/azure
      - run: bash infra/pipelines/verify-infrastructure.sh
