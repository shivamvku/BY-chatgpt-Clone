name: CI
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: younderchat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chat -d younderchat_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://chat:test-only-password@localhost:5432/younderchat_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.lock && pip install --no-deps -e './backend[dev]'
      - run: ruff check backend
      - run: pytest
        working-directory: backend
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm run format:check && npm run test && npm run build
        working-directory: frontend
  terraform:
    name: Terraform fmt, validate and tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check -recursive infra
      - name: Validate all roots without Azure credentials
        run: |
          for root in infra/bootstrap infra/terraform/environments/dev/{foundation,migrations,application,domains}; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
      - name: Test networking policies with mocked Azure providers
        run: terraform -chdir=infra/terraform/environments/dev/foundation test
      - name: Test GitHub federation subjects with mocked Azure providers
        run: terraform -chdir=infra/bootstrap test
      - name: Test custom-domain TLS configuration with mocked Azure providers
        run: terraform -chdir=infra/terraform/environments/dev/domains test
  docker:
    name: Docker build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
